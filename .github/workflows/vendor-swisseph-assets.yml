name: Vendor Swiss Ephemeris runtime assets

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [feat/bundle-swisseph-assets]
    paths:
      - ".github/workflows/vendor-swisseph-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public upstream ephemeris assets
        uses: actions/checkout@v4
        with:
          repository: puneetnarayan/Parashari-Astrology-
          ref: main
          path: upstream
          persist-credentials: false

      - name: Check out Lal Kitab branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: feat/bundle-swisseph-assets
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and validate runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ephemeris/wasm
          cp upstream/ephemeris/wasm/swisseph.js target/ephemeris/wasm/swisseph.js
          cp upstream/ephemeris/wasm/swisseph.wasm target/ephemeris/wasm/swisseph.wasm
          cp upstream/ephemeris/wasm/swisseph.data target/ephemeris/wasm/swisseph.data
          cp upstream/ephemeris/LICENSE-swisseph-wasm.txt target/ephemeris/LICENSE-swisseph-wasm.txt
          test "$(stat -c %s target/ephemeris/wasm/swisseph.js)" -eq 74272
          test "$(stat -c %s target/ephemeris/wasm/swisseph.wasm)" -eq 561871
          test "$(stat -c %s target/ephemeris/wasm/swisseph.data)" -eq 2151204
          test "$(sha1sum target/ephemeris/wasm/swisseph.js | cut -d ' ' -f1)" = "f7d36e518e9f3743f1ea27b19a0aa1d7c75af225"
          test "$(sha1sum target/ephemeris/wasm/swisseph.wasm | cut -d ' ' -f1)" = "a58d1b88947685562b367e56607c3b8002409a00"
          test "$(sha1sum target/ephemeris/wasm/swisseph.data | cut -d ' ' -f1)" = "03850e4899bd8e621869786ded88b515d39a8d9c"

      - name: Commit assets to Lal Kitab branch
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ephemeris/wasm/swisseph.js ephemeris/wasm/swisseph.wasm ephemeris/wasm/swisseph.data ephemeris/LICENSE-swisseph-wasm.txt
          if git diff --cached --quiet; then
            echo "Assets already match upstream; no commit required."
            exit 0
          fi
          git commit -m "Bundle Swiss Ephemeris runtime assets"
          git push origin HEAD:feat/bundle-swisseph-assets
